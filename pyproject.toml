[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pycombine"
version = "0.1.0.dev0"
description = "Python port of cyCombine: batch correction of single-cell cytometry data"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "cyCombine authors" }]
dependencies = [
    "anndata>=0.10",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "formulaic>=1.0",
    "inmoose>=0.7",
    "flowsom>=0.1.1",
    "scanpy>=1.10",
]

[project.optional-dependencies]
io = ["pytometry>=0.1.5"]
eval = ["scib-metrics>=0.5"]
plotting = ["matplotlib>=3.7", "seaborn>=0.13"]
all = [
    "pytometry>=0.1.5",
    "scib-metrics>=0.5",
    "matplotlib>=3.7",
    "seaborn>=0.13",
]
dev = [
    "pytest>=8",
    "pytest-cov",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pycombine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

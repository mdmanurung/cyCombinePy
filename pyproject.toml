[build-system]
requires = ["hatchling>=1.22"]
build-backend = "hatchling.build"

[project]
name = "cycombinepy"
dynamic = ["version"]
description = "Python port of cyCombine: batch correction of single-cell cytometry data"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Mikhael Manurung" },
]
maintainers = [
    { name = "Mikhael Manurung" },
]
keywords = [
    "cytometry",
    "flow-cytometry",
    "cytof",
    "mass-cytometry",
    "batch-correction",
    "combat",
    "flowsom",
    "single-cell",
    "anndata",
    "bioinformatics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "anndata>=0.10",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "formulaic>=1.0",
    "inmoose>=0.7",
    "flowsom>=0.1.1",
    "scanpy>=1.10",
]

[project.optional-dependencies]
io = ["pytometry>=0.1.5", "readfcs>=2"]
eval = ["scib-metrics>=0.5"]
plotting = ["matplotlib>=3.7", "seaborn>=0.13"]
docs = [
    "sphinx>=7",
    "furo>=2024.1",
    "myst-nb>=1.1",
    "sphinx-autodoc-typehints>=2",
]
all = [
    "cycombinepy[io,eval,plotting]",
]
dev = [
    "cycombinepy[all,docs]",
    "pytest>=8",
    "pytest-cov",
    "build>=1.2",
    "twine>=5",
    "jupyter",
    "nbclient",
    "nbconvert",
    "nbformat",
]

[project.urls]
Homepage = "https://github.com/mdmanurung/cyCombinePy"
Documentation = "https://mdmanurung.github.io/cyCombinePy/"
Repository = "https://github.com/mdmanurung/cyCombinePy"
Issues = "https://github.com/mdmanurung/cyCombinePy/issues"
Changelog = "https://github.com/mdmanurung/cyCombinePy/blob/main/CHANGELOG.md"
"Original R package" = "https://github.com/biosurf/cyCombine"

[project.scripts]
cycombinepy-install-skills = "cycombinepy._skills.install:main"

[tool.hatch.version]
path = "src/cycombinepy/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cycombinepy"]

[tool.hatch.build.targets.sdist]
include = [
    "src/cycombinepy",
    "tests",
    "scripts",
    "CITATION.cff",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]
exclude = [
    "inst/**",
    "**/__pycache__",
    "**/*.pyc",
    "**/.pytest_cache",
    ".github/**",
]

[tool.hatch.build.targets.sdist.force-include]
"inst/extdata/test.fcs" = "inst/extdata/test.fcs"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_flowsom: tests requiring FlowSOM",
    "requires_inmoose: tests requiring inmoose",
    "parity: tests comparing against external R cyCombine golden outputs",
    "slow: slower integration tests",
    "docs_notebook: executable notebook checks",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

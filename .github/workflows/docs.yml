name: Deploy documentation to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with docs dependencies
        run: pip install -e ".[docs]" pytest

      - name: Run documentation tests
        run: |
          PYTHONPATH=src pytest \
            tests/test_docs_snippets.py \
            tests/test_readme_snippets.py \
            tests/test_public_api.py \
            tests/test_vignettes.py \
            -q

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Sphinx documentation
        run: sphinx-build -W -b html docs/source docs/build/html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
